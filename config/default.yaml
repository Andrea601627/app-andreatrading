# ============================================================
# AndreaTrading - configurazione di default
# ============================================================

mode: paper            # paper | live  (live richiede credenziali IBKR + flag esplicito)
base_currency: EUR
timezone: Europe/Rome

# ------------------------------------------------------------
# Capitale e allocazione
# ------------------------------------------------------------
capital:
  initial: 1000.0      # capitale di partenza in EUR (paper)
  # Allocazione per orizzonte temporale
  allocation:
    short_medium: 0.80   # 80% breve/medio termine
    long_term: 0.20      # 20% lungo termine
  # Riserva liquida sempre disponibile
  cash_reserve_pct: 0.10

# ------------------------------------------------------------
# Universo titoli
# ------------------------------------------------------------
universe:
  files:
    - config/universe/ftse_mib.csv
    - config/universe/sp500_top100.csv
    - config/universe/sp500_extended.csv
    - config/universe/nasdaq100_extra.csv
    - config/universe/dax40.csv
    - config/universe/ftse100_top30.csv
    - config/universe/cac40_top25.csv
    - config/universe/nikkei50.csv
    - config/universe/hangseng30.csv
  # Filtri di liquidità minimi (per non comprare titoli sottili)
  min_avg_daily_volume_eur: 500000
  min_market_cap_eur: 100000000

# ------------------------------------------------------------
# Screener pre-filtro: ordina tutti i titoli per rendimento recente
# e passa solo i top N al loop lento per l'analisi completa
# ------------------------------------------------------------
screener:
  top_n_for_analysis: 100   # top 100 per analisi completa ogni 15 min
  top_n_watchlist: 30       # top 30 per fast loop (watchlist momentum)
  lookback_days: 5          # rendimento su 5 giorni di borsa

# ------------------------------------------------------------
# Pesi multi-fattore per orizzonte
# (sono i prior; il learning engine li adatta nel tempo)
# ------------------------------------------------------------
weights:
  short_medium:
    technical: 0.45
    fundamental: 0.25
    ml_forecast: 0.15
    sentiment: 0.15
  long_term:
    technical: 0.15
    fundamental: 0.55
    ml_forecast: 0.10
    sentiment: 0.05

# Soglie di decisione sullo score aggregato [-100, +100]
decision_thresholds:
  strong_buy: 70
  buy: 40
  hold_upper: 40
  hold_lower: -25
  sell: -25
  strong_sell: -55

# ------------------------------------------------------------
# Risk management - vincoli rigidi
# ------------------------------------------------------------
risk:
  max_position_pct: 0.10           # max 10% capitale per singolo titolo
  max_sector_pct: 0.30             # max 30% per settore
  max_concurrent_positions: 15
  stop_loss:
    method: atr                    # atr | percent | trailing
    atr_multiple: 2.5
    fallback_pct: 0.07             # stop al -7% se ATR non disponibile
  trailing_stop_activate_at_pct: 0.05   # attiva trailing dopo +5%
  drawdown_circuit_breaker_pct: 0.15    # ferma tutto se equity scende -15% dal picco

# ------------------------------------------------------------
# Data quality - se i dati non passano i check non si opera
# ------------------------------------------------------------
data_quality:
  min_history_days: 200             # almeno 200 giorni di storia
  max_missing_pct: 0.02             # max 2% di valori mancanti
  max_gap_days: 5                   # max gap di 5 giorni consecutivi
  reject_if_no_fundamentals: false  # se mancano i fondamentali usa solo tecnico ridotto
  cross_validate_sources: true      # confronto fra fonti quando possibile

# ------------------------------------------------------------
# Loop di esecuzione
# ------------------------------------------------------------
orchestrator:
  cycle_interval_seconds: 900       # ogni 15 min (loop lento - analisi completa)
  market_hours:
    open: "09:00"
    close: "17:30"
  trade_only_market_hours: true
  cooldown_after_loss_minutes: 1440 # 24h no auto-adjust dopo perdita

# ------------------------------------------------------------
# Learning engine - safeguards anti-overfitting
# ------------------------------------------------------------
learning:
  enabled: true
  min_trades_before_adjust: 30
  significance_p_value: 0.05
  max_weight_delta: 0.20            # se modifica >20% chiede conferma utente
  walk_forward_validation: true

# ------------------------------------------------------------
# Broker
# ------------------------------------------------------------
# Broker scelto: Interactive Brokers (IBKR) — piano Tiered
#   Commissioni: 0.05% del controvalore, minimo €1.25 per ordine
#   Vantaggi: API completa, tutti i mercati mondiali, regolamentato
#
# Per collegare l'account reale in futuro:
#   1. Apri conto su interactivebrokers.com (minimo €2.000 raccomandato)
#   2. Installa TWS o IB Gateway sul server: https://www.interactivebrokers.com/en/trading/tws.php
#   3. In TWS: File → Global Config → API → Settings → abilita socket, porta 7496
#   4. Modifica mode: live in questo file
#   5. Il sistema si collegherà automaticamente via ib_insync
broker:
  paper:
    commission_model: ibkr_tiered   # ibkr_tiered | fixed
    commission_pct: 0.0005          # 0.05% del controvalore (IBKR Tiered)
    commission_min_eur: 1.25        # minimo €1.25 per ordine
    commission_max_pct: 0.01        # mai più dell'1% del controvalore
    commission_per_trade_eur: 2.95  # usato solo se commission_model: fixed
    slippage_bps: 5                 # 0.05% di slippage simulato
  ibkr:
    host: 127.0.0.1
    port: 7496                      # 7496 live TWS, 7497 paper TWS, 4002 IB Gateway live
    client_id: 1

# ------------------------------------------------------------
# Storage
# ------------------------------------------------------------
storage:
  db_path: data/andreatrading.db
  cache_path: data/cache

# ------------------------------------------------------------
# Momentum (fast loop) - parametri basati su strategie professionali
# ------------------------------------------------------------
momentum:
  fast_cycle_seconds: 60          # ciclo ogni minuto

  # Rilevamento trend (candele 5-minuto, lookback 3 candele = 15 min reali)
  lookback_minutes: 3
  threshold_pct: 0.001            # 0.1% movimento minimo su 15 min
  strong_threshold_pct: 0.004     # 0.4% per segnale forte
  volume_multiplier: 1.1          # usato per sizing, non più blocco obbligatorio

  # Universo monitorato — puro trend following su tutto l'universo
  watchlist_size: 60              # top 60 titoli per trend (era 30)

  # Sizing basato su forza del trend — ridotto per supportare più posizioni simultanee
  strong_size_pct: 0.05           # trend forte  → 5% del capitale (era 8%)
  medium_size_pct: 0.03           # trend medio  → 3% (era 5%)
  weak_size_pct: 0.02             # trend debole → 2% (era 3%)
  max_fast_positions: 12          # max posizioni aperte in contemporanea (era 5)

  # Protezione guadagni
  profit_lock_trigger_pct: 0.012  # attiva trailing dopo +1.2%
  profit_trail_pct: 0.004         # vendi se scende 0.4% dal picco
  hard_stop_pct: 0.015            # stop loss fisso a -1.5% — mai perdere più di questo

  # Commissioni IBKR Tiered (minimo per calcoli interni)
  commission_eur: 1.25
  min_net_gain_pct: 0.006         # guadagno netto minimo 0.6% — copre commissioni tiered

  # Rotazione posizioni: sostituisce posizioni peggiori con opportunità migliori
  rotation_enabled: true
  # soglia minima = costo commissioni round-trip (calcolato dinamicamente per posizione)

# ------------------------------------------------------------
# Arbitraggio cross-listed (loop separato ogni 30s)
# ------------------------------------------------------------
arbitrage:
  cycle_seconds: 30             # più veloce del fast loop (30s vs 60s)
  min_spread_pct: 0.0035        # spread minimo 0.35% (copre commissioni A/R)
  size_pct: 0.02                # 2% del capitale per ogni trade arb
  max_positions: 6              # max posizioni arb aperte contemporaneamente
